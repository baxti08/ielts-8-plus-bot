{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:360px;margin:80px auto;">
  <div class="card">
    <h1>Admin panelga kirish</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="row"><input name="username" placeholder="Login" style="width:100%" required></div>
      <div class="row"><input name="password" type="password" placeholder="Parol" style="width:100%" required></div>
      <button type="submit">Kirish</button>
    </form>
  </div>
</div>
{% endblock %}
